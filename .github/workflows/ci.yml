name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The tests stub out the models, so torch and the Hugging Face models are
      # not installed here. numpy and faiss-cpu cover task 1's search backends.
      - run: pip install pytest ruff numpy faiss-cpu
      - run: ruff check .
      - run: pytest -q tests
      - name: Task 2 end-to-end on the bundled text
        run: python task2_text_pipeline/pipeline.py data/pride_and_prejudice_ch1-3.txt --show 0
